name: Add a series of sets

on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Series name as pokemon-tcg-data spells it, e.g. "Sun & Moon" or "XY"'
        required: true

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add the sets
        env:
          SERIES: ${{ inputs.series }}
        run: python3 scripts/add_sets.py --series "$SERIES" --report "$RUNNER_TEMP/report.txt"
      - name: Save the new sets
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "Nothing new to add."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -F "$RUNNER_TEMP/report.txt"
            git push
          fi
